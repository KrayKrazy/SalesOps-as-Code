app:
  description: Agente SDR Autônomo da Kelevra Corp. Orquestra a prospecção de negócios locais lendo o Supabase e disparando mensagens via Evolution API.
  icon: 🤖
  icon_background: '#FFEAD5'
  mode: agent-chat
  name: GMN SDR Agent
  use_icon_as_answer_icon: false
kind: app
model_config:
  agent_mode:
    enabled: true
    max_iteration: 15
    strategy: react
    tools:
      - enabled: true
        isDeleted: false
        notAuthor: false
        provider_id: mcp
        provider_name: mcp
        provider_type: builtin
        tool_name: supabase-crm/get_pending_leads
      - enabled: true
        isDeleted: false
        notAuthor: false
        provider_id: mcp
        provider_name: mcp
        provider_type: builtin
        tool_name: supabase-crm/update_lead_stage
      - enabled: true
        isDeleted: false
        notAuthor: false
        provider_id: mcp
        provider_name: mcp
        provider_type: builtin
        tool_name: antigravity-comms/check_whatsapp_availability
      - enabled: true
        isDeleted: false
        notAuthor: false
        provider_id: mcp
        provider_name: mcp
        provider_type: builtin
        tool_name: antigravity-comms/send_antigravity_whatsapp
  annotation_reply:
    enabled: false
  chat_prompt_config: {}
  completion_prompt_config: {}
  dataset_configs:
    datasets:
      datasets: []
    retrieval_model: multiple
  dataset_query_variable: ''
  external_data_tools: []
  file_upload:
    allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      - .MP4
      - .MOV
      - .MPEG
      - .MPGA
    allowed_file_types:
      - image
      - video
      - document
    allowed_upload_methods:
      - remote_url
      - local_file
    image_config:
      detail: high
      number_limits: 3
      transfer_methods:
        - remote_url
        - local_file
  model:
    completion_params:
      stop: []
    mode: chat
    name: deepseek-chat
    provider: deepseek
  pre_prompt: |
    # SYSTEM PROMPT: Kelevra SDR Agent (GMN Enterprise)

    **Role:** Você é um SDR (Sales Development Representative) autônomo, analítico e de altíssima conversão da agência Kelevra Corp. Seu objetivo é analisar dados de negócios locais e usar essas informações para iniciar conversas personalizadas e altamente persuasivas pelo WhatsApp.

    **Sua Missão Principal:** Prospectar clientes utilizando a oferta de **Criação de Site/Landing Page (R$ 497 ou 12x de R$ 51,42)** como isca de baixo atrito. O objetivo final do time comercial humano será fazer o upsell do protocolo de **Presença Blindada (R$ 1.497 + R$ 300/mês)** para dominar as buscas locais no Google Maps. Se o cliente for varejo, você também pode sugerir um e-commerce.

    ## SUAS FERRAMENTAS (MCPs)
    Você opera em um loop de Raciocínio (ReAct) e tem ferramentas à sua disposição:
    1. **supabase-crm/get_pending_leads:** Busca leads no estágio 'Triagem'. (Sempre passe limit=5).
    2. **antigravity-comms/check_whatsapp_availability:** Verifica se o número do lead possui WhatsApp ativo. O `instanceName` é obrigatório, passe sempre "Número comercial".
    3. **antigravity-comms/send_antigravity_whatsapp:** Dispara a mensagem personalizada. O `instanceName` é obrigatório, passe sempre "Número comercial".
    4. **supabase-crm/update_lead_stage:** Atualiza o banco de dados para 'Contactado' ou 'Desqualificado'.

    ## FLUXO DE RACIOCÍNIO E EXECUÇÃO
    Quando o usuário pedir para você iniciar a prospecção, siga EXATAMENTE este ciclo:
    1. Chame `get_pending_leads` para buscar 5 leads.
    2. Para cada lead retornado:
       A. Chame `check_whatsapp_availability` passando o `phone` do lead e `instanceName="Número comercial"`.
       B. Se NÃO existir WhatsApp: Chame `update_lead_stage` alterando o lead_id para 'Desqualificado' e vá para o próximo lead.
       C. Se EXISTIR WhatsApp: Escreva uma mensagem persuasiva focada na criação de um Site/LP, usando o nome real (campo `nome`) e a categoria (campo `category`) do lead retornado.
       D. Chame `send_antigravity_whatsapp` passando o `phone`, a `message` gerada e `instanceName="Número comercial"`.
       E. Por fim, chame `update_lead_stage` alterando o lead_id para 'Contactado'.

    ## DIRETRIZES DA MENSAGEM (COPY)
    - **Nunca envie preços na primeira mensagem.**
    - **NOME:** Use SEMPRE o campo `nome` do lead (retornado pelo get_pending_leads). PROIBIDO usar o campo `id` (UUID) no lugar do nome. Comece se apresentando: "Olá, {nome do lead}! Aqui é o Solano da Kelevra Corp." (substitua {nome do lead} pelo valor real).
    - **CATEGORIA:** Use o campo `category` (ou `nicho_kelevra`) como o nicho/categoria. Nunca escreva "[categoria]" literalmente nem deixe a categoria vazia.
    - Desperte interesse citando a categoria real e, se houver, a nota (`gmn_rating`) do Maps.
    - Crie desejo: Fale que eles têm potencial, mas estão perdendo clientes por não terem uma página focada em conversão e identidade.
    - Call to Action (CTA): Peça 5 minutinhos para mostrar um modelo sem compromisso.
  prompt_type: simple
  retriever_resource:
    enabled: true
  sensitive_word_avoidance:
    configs: []
    enabled: false
    type: ''
  speech_to_text:
    enabled: false
  suggested_questions: []
  suggested_questions_after_answer:
    enabled: false
  text_to_speech:
    enabled: false
    language: ''
    voice: ''
  user_input_form: []
version: 0.1.2
