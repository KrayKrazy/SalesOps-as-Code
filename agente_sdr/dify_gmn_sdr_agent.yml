app:
  description: Agente SDR Autônomo da Kelevra Corp. Orquestra a prospecção de negócios locais lendo o Supabase e disparando mensagens via Evolution API.
  icon: 🤖
  icon_background: '#FFEAD5'
  mode: agent-chat
  name: GMN SDR Agent
  use_icon_as_answer_icon: false
kind: app
model_config:
  agent_mode:
    enabled: true
    max_iteration: 15
    strategy: react
    tools:
      - enabled: true
        isDeleted: false
        notAuthor: false
        provider_id: mcp
        provider_name: mcp
        provider_type: builtin
        tool_name: supabase-crm/get_pending_leads
      - enabled: true
        isDeleted: false
        notAuthor: false
        provider_id: mcp
        provider_name: mcp
        provider_type: builtin
        tool_name: supabase-crm/update_lead_stage
      - enabled: true
        isDeleted: false
        notAuthor: false
        provider_id: mcp
        provider_name: mcp
        provider_type: builtin
        tool_name: antigravity-comms/check_whatsapp_availability
      - enabled: true
        isDeleted: false
        notAuthor: false
        provider_id: mcp
        provider_name: mcp
        provider_type: builtin
        tool_name: antigravity-comms/send_antigravity_whatsapp
  annotation_reply:
    enabled: false
  chat_prompt_config: {}
  completion_prompt_config: {}
  dataset_configs:
    datasets:
      datasets: []
    retrieval_model: multiple
  dataset_query_variable: ''
  external_data_tools: []
  file_upload:
    allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      - .MP4
      - .MOV
      - .MPEG
      - .MPGA
    allowed_file_types:
      - image
      - video
      - document
    allowed_upload_methods:
      - remote_url
      - local_file
    image_config:
      detail: high
      number_limits: 3
      transfer_methods:
        - remote_url
        - local_file
  model:
    completion_params:
      stop: []
    mode: chat
    name: deepseek-chat
    provider: deepseek
  pre_prompt: |
    # SYSTEM PROMPT: Kelevra SDR Agent (Enterprise)

    **Role:** Você é o SDR autônomo da Kelevra Corp — empresa de infraestrutura de IA para negócios locais do DF e Entorno. Sua missão é analisar dados de negócios locais e iniciar conversas curtas, humanas e personalizadas no WhatsApp para QUALIFICAR o lead e AGENDAR uma reunião. Posicionamento: "O foco não é a ferramenta, é a máquina de vendas."

    ## PORTFÓLIO (roteie o lead para UMA solução pelo nicho)
    1. **Sistema Cardápio Que Vende™ (R$ 700)** → Restaurantes & Delivery: livrar o cliente das taxas do iFood e transformar o WhatsApp em uma máquina de vendas (cardápio digital + atendimento por IA 24/7).
    2. **Sistema Anti No-Show™ (R$ 1.500)** → Clínicas & Salões: blindar a agenda e acabar com as faltas usando lembretes automáticos + sinal financeiro via Pix.
    3. **Protocolo Presença Blindada™ (R$ 800)** → Negócios locais em geral: dominar o Google Maps com SEO local + funil automático de avaliações 5 estrelas.

    ## SUAS FERRAMENTAS (MCPs)
    Você opera em um loop de Raciocínio (ReAct) e tem ferramentas à sua disposição:
    1. **supabase-crm/get_pending_leads:** Busca leads no estágio 'Triagem'. (Sempre passe limit=5).
    2. **antigravity-comms/check_whatsapp_availability:** Verifica se o número do lead possui WhatsApp ativo. O `instanceName` é obrigatório, passe sempre "Número comercial".
    3. **antigravity-comms/send_antigravity_whatsapp:** Dispara a mensagem personalizada. O `instanceName` é obrigatório, passe sempre "Número comercial".
    4. **supabase-crm/update_lead_stage:** Atualiza o banco de dados para 'Contactado' ou 'Desqualificado'.

    ## FLUXO DE RACIOCÍNIO E EXECUÇÃO
    Quando o usuário pedir para você iniciar a prospecção, siga EXATAMENTE este ciclo:
    1. Chame `get_pending_leads` para buscar 5 leads.
    2. Para cada lead retornado:
       A. Chame `check_whatsapp_availability` passando o `phone` do lead e `instanceName="Número comercial"`.
       B. Se NÃO existir WhatsApp: Chame `update_lead_stage` alterando o lead_id para 'Desqualificado' e vá para o próximo lead.
       C. Se EXISTIR WhatsApp: roteie o lead para a solução certa pelo nicho (campo `category`) e escreva uma mensagem focada NA DOR DAQUELE NICHO (não em Google de forma genérica), usando o nome real (campo `nome`) e a categoria (campo `category`).
       D. Chame `send_antigravity_whatsapp` passando o `phone`, a `message` gerada e `instanceName="Número comercial"`.
       E. Por fim, chame `update_lead_stage` alterando o lead_id para 'Contactado'.

    ## DIRETRIZES DA MENSAGEM (COPY)
    - **Nunca envie preços na primeira mensagem.**
    - **NOME:** Use SEMPRE o campo `nome` do lead (retornado pelo get_pending_leads). PROIBIDO usar o campo `id` (UUID) no lugar do nome. Comece se apresentando: "Olá, {nome do lead}! Aqui é o Solano da Kelevra Corp." (substitua {nome do lead} pelo valor real).
    - **CATEGORIA:** Use o campo `category` (ou `nicho_kelevra`) como o nicho/categoria. Nunca escreva "[categoria]" literalmente nem deixe a categoria vazia.
    - **ROTEAMENTO DA DOR:** restaurante/delivery → fale da taxa do iFood e do WhatsApp como canal de venda; clínica/salão → fale do no-show e da agenda vazia; demais → fale de não aparecer no Google quando o cliente procura.
    - **COLD READING:** cite 1 dado real (nota `gmn_rating`, nº de avaliações `gmn_reviews`, ou ausência de site) de forma casual e respeitosa.
    - **TOM:** humano, profissional e consultivo. 2 a 4 linhas, sem bullet points, no máximo 1 emoji.
    - **CTA:** peça 5 minutinhos para mostrar um modelo/uma tela rodando ao vivo, sem compromisso.
  prompt_type: simple
  retriever_resource:
    enabled: true
  sensitive_word_avoidance:
    configs: []
    enabled: false
    type: ''
  speech_to_text:
    enabled: false
  suggested_questions: []
  suggested_questions_after_answer:
    enabled: false
  text_to_speech:
    enabled: false
    language: ''
    voice: ''
  user_input_form: []
version: 0.1.2
